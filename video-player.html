<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Episode 1 – Workplace Nightmare | LearnFlix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .player-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-wrapper {
      position: relative;
      width: 90vw;
      height: 90vh;
      max-width: 1280px;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.8);
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }
    #playButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100px;
      height: 100px;
      border: none;
      border-radius: 50%;
      background: rgba(229, 9, 20, 0.9);
      cursor: pointer;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      transition: background 0.3s, transform 0.3s;
    }
    #playButton:hover {
      background: rgba(229, 9, 20, 1);
      transform: translate(-50%, -50%) scale(1.1);
    }
    #playButton.hidden {
      display: none;
    }
    video::-webkit-media-controls-panel {
      background-color: rgba(0, 0, 0, 0.8);
    }
    .placeholder-video {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f1f1f 0%, #2d2d2d 100%);
      font-size: 3rem;
      flex-direction: column;
      gap: 20px;
    }
    .placeholder-video span {
      font-size: 1rem;
      color: #aaa;
      margin-top: 10px;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background: #e50914;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #f40612; }
    button.secondary {
      background: #333;
      color: #fff;
    }
    button.secondary:hover { background: #555; }
    .info {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #1a1a1a;
      border-radius: 8px;
    }
    .info h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .info p {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .episode-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="player-container">
  <!-- Video Player -->
  <div class="video-wrapper">
    <video id="videoPlayer" muted controls>
      <source src="Episode 1/Videos/episode 1.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>    <button id="playButton" onclick="playVideo()">▶</button>  </div>

  <!-- Close button overlay -->
  <button class="secondary" onclick="window.close();" style="position: absolute; top: 20px; right: 20px; z-index: 100;">✕ Close</button>
</div>

<script>
  function playVideo() {
    const video = document.getElementById('videoPlayer');
    const playButton = document.getElementById('playButton');
    
    // Unmute and play
    video.muted = false;
    video.play();
    
    // Hide play button
    playButton.classList.add('hidden');
  }
</script>

</body>
</html>
