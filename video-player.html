<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Episode 1 – Workplace Nightmare | LearnFlix</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    .player-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .video-wrapper {
      /* fill as much space as possible while keeping 16:9 */
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      position: relative;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
    }
    .vimeo-embed,
    .vimeo-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .close-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: rgba(51,51,51,.9);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .close-btn:hover { background: rgba(80,80,80,.95); }
  </style>
</head>
<body>

<div class="player-container">
  <div class="video-wrapper">
    <div class="vimeo-embed">
      <iframe src="https://player.vimeo.com/video/1193644471?badge=0&autopause=0&player_id=0&app_id=58479"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        title="episode 1">
      </iframe>
    </div>
  </div>
</div>

<button class="close-btn" onclick="window.close();">✕ Close</button>

<script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
