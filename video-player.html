<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Episode 1 – Workplace Nightmare | LearnFlix</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .player-container {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-wrapper {
      position: relative;
      width: 90vw;
      height: 90vh;
      max-width: 1280px;
      aspect-ratio: 16/9;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.8);
    }
    .vimeo-embed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .vimeo-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .controls {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
      justify-content: center;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      background: #e50914;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #f40612; }
    button.secondary {
      background: #333;
      color: #fff;
    }
    button.secondary:hover { background: #555; }
    .info {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #1a1a1a;
      border-radius: 8px;
    }
    .info h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    .info p {
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .episode-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
      color: #aaa;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

<div class="player-container">
  <div class="video-wrapper">
    <div class="vimeo-embed">
      <iframe src="https://player.vimeo.com/video/1193644471?badge=0&autopause=0&player_id=0&app_id=58479"
        frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        title="episode 1">
      </iframe>
    </div>
  </div>

  <!-- Close button overlay -->
  <button class="secondary" onclick="window.close();" style="position: absolute; top: 20px; right: 20px; z-index: 100;">✕ Close</button>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>

</body>
</html>
