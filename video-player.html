<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Episode 1 – Workplace Nightmare | LearnFlix</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    iframe#vimeoPlayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      z-index: 1;
    }
    .back-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 200;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: rgba(51,51,51,.9);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .back-btn:hover { background: rgba(80,80,80,.95); }
  </style>
</head>
<body>

<iframe id="vimeoPlayer"
  src="https://player.vimeo.com/video/1193644471?badge=0&autopause=0&player_id=0&app_id=58479"
  allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
  referrerpolicy="strict-origin-when-cross-origin"
  title="episode 1">
</iframe>

<button class="back-btn" onclick="window.location.href='index.html';">← Back to LearnFlix</button>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  var player = new Vimeo.Player(document.getElementById('vimeoPlayer'));

  player.on('timeupdate', function(data) {
    var pct = Math.round(data.percent * 100);
    localStorage.setItem('ep1_progress', pct);
  });

  player.on('ended', function() {
    localStorage.setItem('ep1_progress', 100);
  });
</script>

</body>
</html>
